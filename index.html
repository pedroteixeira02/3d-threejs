<!DOCTYPE html>
<html lang="pt.br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        #btn {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: white;
            backdrop-filter: blur(10px);
            padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .controles { margin-bottom: 15px; }
        .controles:last-child { margin-bottom: 0; }
        button {
            margin-top: 8px; margin-right: 5px; padding: 8px 12px;
            cursor: pointer; border: 1px solid #d1d1d1;
            border-radius: 6px; background: #ffffff;
            transition: all 0.2s; font-size: 13px;
        }
        button:hover { background: #f0f0f0; border-color: #a1a1a1; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="btn">
        <div class="controles">
            <strong>Membro 1:</strong><br>
            <button onclick="playAnim(1, 0)">Ação 1</button>
            <button onclick="playAnim(1, 1)">Ação 2</button>
            <button onclick="playAnim(1, 2)">Ação 3</button>
        </div>
        <div class="controles">
            <strong>Membro 2:</strong><br>
            <button onclick="playAnim(2, 0)">Ação 1</button>
            <button onclick="playAnim(2, 1)">Ação 2</button>
            <button onclick="playAnim(2, 2)">Ação 3</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 15, 50);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const planeGeometry = new THREE.PlaneGeometry(60, 60);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.9 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        const grid = new THREE.GridHelper(60, 60, 0x000000, 0x000000);
        grid.material.opacity = 0.08;
        grid.material.transparent = true;
        scene.add(grid);

        let mixer1, mixer2;
        let actions1 = [], actions2 = [];
        let activeAction1, activeAction2;
        const loader = new GLTFLoader();

        function enableShadows(model) {
            model.traverse((node) => {
                if (node.isMesh) { 
                    node.castShadow = true; 
                    node.receiveShadow = true; 
                }
            });
        }

        loader.load('modelo_1.glb', (gltf) => {
            const model1 = gltf.scene;
            model1.scale.set(1, 1, 1); 
            model1.position.set(-2, 0, 0);
            model1.rotation.y = Math.PI / 8; 
            
            enableShadows(model1);
            scene.add(model1);

            mixer1 = new THREE.AnimationMixer(model1);
            gltf.animations.forEach((clip) => actions1.push(mixer1.clipAction(clip)));
            
            if (actions1.length > 0) {
                activeAction1 = actions1[0];
                activeAction1.play();
            }
        });

        loader.load('modelo_2.glb', (gltf) => {
            const model2 = gltf.scene;
            model2.scale.set(1, 1, 1);
            model2.position.set(2, 0, 0);
            model2.rotation.y = -Math.PI / 8;

            enableShadows(model2);
            scene.add(model2);

            mixer2 = new THREE.AnimationMixer(model2);
            gltf.animations.forEach((clip) => actions2.push(mixer2.clipAction(clip)));
            
            if (actions2.length > 0) {
                activeAction2 = actions2[0];
                activeAction2.play();
            }
        });

        window.playAnim = function(member, animIndex) {
            if (member === 1 && actions1.length > animIndex) {
                const nextAction = actions1[animIndex];
                if (activeAction1 !== nextAction) {
                    nextAction.reset().fadeIn(0.3).play();
                    activeAction1.fadeOut(0.3);
                    activeAction1 = nextAction;
                }
            } else if (member === 2 && actions2.length > animIndex) {
                const nextAction = actions2[animIndex];
                if (activeAction2 !== nextAction) {
                    nextAction.reset().fadeIn(0.3).play();
                    activeAction2.fadeOut(0.3);
                    activeAction2 = nextAction;
                }
            }
        };

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer1) mixer1.update(delta);
            if (mixer2) mixer2.update(delta);
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
